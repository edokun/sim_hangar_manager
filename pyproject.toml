[project]
name = "sim-hangar-manager"
version = "0.1.0"
description = "Manage Aircraft used in flight simulators."
authors = [
    {name = "Eduardo Vidal",email = "gamucckib@mozmail.com"}
]
license = {text = "GPL 3.0"}
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "alembic (>=1.18.5,<2.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "inquirerpy (>=0.3.4,<0.4.0)",
    "rich (>=15.0.0,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
