[project]
name = "sim-hangar-manager"
version = "0.1.0"
description = "Simple tool to manage a personal hangar for flight simulators."
authors = [
    {name = "Eduardo Vidal",email = "gamucckib@mozmail.com"}
]
license = {text = "GPL 3.0"}
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "alembic (>=1.18.5,<2.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "inquirerpy (>=0.3.4,<0.4.0)",
    "rich (>=15.0.0,<16.0.0)",
    "typer (>=0.27.2,<0.28.0)"
]

[tool.poetry]
packages = [{include = "sim_hangar_manager", from = "src"}]

[tool.poetry.scripts]
sim_hangar_manager = "sim_hangar_manager.__main__:main"
simhm = "sim_hangar_manager.cli.cli_app:app"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "coverage (>=7.17.0,<8.0.0)"
]
